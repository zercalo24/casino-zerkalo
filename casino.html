<style>:root{--bg:#07060d;--fg:#ecebf5;--mut:#9a98b3;--glass:rgba(255,255,255,.05);--bd:rgba(255,255,255,.1);--v:#8B5CF6;--c:#06B6D4;--g:#F59E0B;--r:18px}

.btn.p{background:linear-gradient(120deg,var(--v),var(--c));border:0;color:#fff;box-shadow:0 0 28px #8B5CF666}

.rip{position:absolute;border-radius:50%;background:#fff6;transform:scale(0);animation:rp .6s forwards}@keyframes rp{to{transform:scale(4);opacity:0}}
.hero{padding:110px 0 70px}.hero h1{font-size:clamp(2.2rem,7vw,5rem);max-width:900px}
.hero h1 span{display:inline-block;opacity:0;transform:translateY(40px);filter:blur(8px);animation:in .8s forwards}

.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
